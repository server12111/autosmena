services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smena
      POSTGRES_USER: smena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U smena -d smena]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: [alembic, upgrade, head]
  admin:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    command: [python, -m, app.bot]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: [python, -m, app.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
