services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      admin:
        condition: service_started
volumes:
  caddy_data:
  caddy_config:
