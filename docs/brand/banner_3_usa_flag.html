<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased}

.bg{width:1280px;height:720px;background:radial-gradient(90% 120% at 10% 0%,#3352A8 0%,#24408A 40%,#1A2F6B 100%);position:relative;overflow:hidden;color:#fff}
.flag{position:absolute;right:0;top:0;width:640px;height:720px;
 background:repeating-linear-gradient(180deg,#B22234 0 55.4px,#FFFFFF 55.4px 110.8px);
 -webkit-mask:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.04) 25%,rgba(0,0,0,.22) 50%,rgba(0,0,0,.6) 75%,#000 100%)}
.canton{position:absolute;right:0;top:0;width:380px;height:388px;background:linear-gradient(90deg,rgba(60,59,110,0) 0%,#3C3B6E 35%);display:flex;flex-direction:column;justify-content:space-evenly;padding:10px 0}
.sr{display:flex;justify-content:space-evenly;padding:0 14px 0 90px}
.sr:nth-child(even){padding:0 40px 0 116px}
.sr span{font-size:26px;line-height:1;color:#fff}
.shade-old{position:absolute;right:0;top:0;width:640px;height:720px;background:radial-gradient(48% 42% at 64% 70%,rgba(26,47,107,.78),rgba(26,47,107,.35) 55%,transparent 80%)}
.glass{position:absolute;right:56px;top:250px;width:400px;height:310px;display:flex;align-items:center;justify-content:center;border-radius:44px;
 background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 55%,rgba(255,255,255,.12));
 backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
 border:1.5px solid rgba(255,255,255,.45);
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.12),0 30px 60px rgba(10,20,60,.35)}
.glass::before{content:"";position:absolute;inset:0;border-radius:44px;background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 30%)}
.plus{position:relative;z-index:1;margin-left:-14px;font-weight:900;font-size:236px;letter-spacing:-14px;line-height:1;
 background:linear-gradient(170deg,#FFFFFF 30%,#D8E3FF 100%);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 10px 28px rgba(10,20,60,.35));
 }
.left{position:absolute;left:90px;top:130px;width:640px}
.tag{display:inline-block;padding:10px 18px;border-radius:10px;background:#E63946;font-weight:800;font-size:22px;letter-spacing:3px}
h1{margin-top:28px;font-weight:900;font-size:92px;line-height:.98;letter-spacing:-3px}
p{margin-top:24px;font-size:28px;opacity:.8;font-weight:500}
.chips{margin-top:38px;display:flex;gap:12px}
.chips span{padding:12px 20px;border-radius:999px;font-weight:600;font-size:19px;white-space:nowrap;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.08));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 20px rgba(10,20,60,.25)}
</style></head><body><div class="bg"><div class="flag"><div class="canton"><div class="sr"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div class="sr"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div class="sr"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div class="sr"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div class="sr"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div class="sr"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div class="sr"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div class="sr"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div class="sr"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div></div></div><div class="glass"><div class="plus">+1</div></div>
<div class="left"><span class="tag">SMENA</span><h1>Американские<br>номера Telegram</h1><p>Виртуальные номера +1 · коды приходят в бот</p><div class="chips"><span>60+ дней аренды</span><span>Код прямо в чат</span><span>Оплата криптой</span></div></div></div></body></html>
