<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased}

.bg{width:1280px;height:720px;background:linear-gradient(150deg,#1A2A5E 0%,#0E1838 100%);position:relative;overflow:hidden;color:#fff}
.flag{position:absolute;right:0;top:0;width:640px;height:720px;
 background:repeating-linear-gradient(180deg,#B22234 0 55.4px,#FFFFFF 55.4px 110.8px);
 -webkit-mask:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.04) 25%,rgba(0,0,0,.22) 50%,rgba(0,0,0,.6) 75%,#000 100%)}
.canton{position:absolute;right:0;top:0;width:380px;height:388px;background:linear-gradient(90deg,rgba(60,59,110,0) 0%,#3C3B6E 35%);display:flex;flex-direction:column;justify-content:space-evenly;padding:10px 0}
.sr{display:flex;justify-content:space-evenly;padding:0 14px 0 90px}
.sr:nth-child(even){padding:0 40px 0 116px}
.sr span{font-size:26px;line-height:1;color:#fff}
.shade-old{position:absolute;right:0;top:0;width:640px;height:720px;background:radial-gradient(48% 42% at 64% 70%,rgba(26,47,107,.78),rgba(26,47,107,.35) 55%,transparent 80%)}
.halo{position:absolute;right:0;top:200px;width:620px;height:480px;background:radial-gradient(42% 46% at 62% 50%,rgba(20,34,80,.8),rgba(20,34,80,.35) 60%,transparent 82%)}
.plus{position:absolute;right:104px;top:322px;font-weight:900;font-size:250px;letter-spacing:-14px;line-height:1;
 background:linear-gradient(170deg,#FFFFFF 30%,#D8E3FF 100%);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 10px 28px rgba(10,20,60,.35));
 }
.left{position:absolute;left:90px;top:50%;transform:translateY(-50%);width:600px}
.tag{display:inline-block;padding:10px 18px;border-radius:10px;background:#E63946;font-weight:800;font-size:22px;letter-spacing:3px}
h1{margin-top:28px;font-weight:900;font-size:92px;line-height:1.06;letter-spacing:-1px}
p{margin-top:26px;line-height:1.35;font-size:28px;opacity:.8;font-weight:500}
.chips{margin-top:38px;display:flex;gap:12px}
.chips span{padding:12px 18px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);font-weight:600;font-size:19px;white-space:nowrap}

.art{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:500px;height:560px}
.glow{position:absolute;right:-80px;top:50%;transform:translateY(-50%);width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(27,162,122,.22) 0%,transparent 62%)}
.glass{position:absolute;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 30px 60px rgba(4,10,35,.45);backdrop-filter:blur(16px)}
.muted{color:#93A3C2;font-weight:600}
.mono{font-family:'JetBrains Mono',monospace}

.coin{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;box-shadow:inset 0 -10px 24px rgba(0,0,0,.25),inset 0 6px 14px rgba(255,255,255,.35),0 24px 50px rgba(4,10,35,.5)}
.usdt{width:230px;height:230px;left:10px;top:30px;background:radial-gradient(circle at 35% 30%,#4FE3B5,#1BA27A 60%,#11785A);font-size:120px}
.ton{width:180px;height:180px;right:0;top:120px;background:radial-gradient(circle at 35% 30%,#7FD3FF,#0098EA 60%,#0068A8)}
.ton svg{width:92px;height:92px}
.pay{left:60px;top:300px;width:400px;padding:30px 32px}
.pay .t{font-size:18px}.pay b{display:block;font-size:56px;font-weight:900;color:#fff;margin-top:6px;letter-spacing:-2px}
.pay .m{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:22px;font-weight:700;color:#fff}
.pay .m span{margin-left:auto;font-size:17px;font-weight:600;color:#93A3C2}
.pay .m i{width:12px;height:12px;border-radius:50%}.pay .g{background:#2FD38A}.pay .b{background:#5AC8FA}.pay .t2{background:#0098EA}
.ok{margin-top:18px;display:inline-block;padding:10px 16px;border-radius:12px;background:rgba(52,199,89,.18);border:1px solid rgba(52,199,89,.5);color:#7CF0A0;font-weight:700;font-size:18px}
</style></head><body><div class="bg"><div class="glow"></div><div class="art"><div class="coin usdt"><svg viewBox="0 0 100 100" style="width:130px;height:130px"><rect x="22" y="22" width="56" height="13" rx="3" fill="#fff"/><rect x="43" y="22" width="14" height="58" rx="3" fill="#fff"/><ellipse cx="50" cy="47" rx="30" ry="8" fill="none" stroke="#fff" stroke-width="5"/></svg></div>
<div class="coin ton"><svg viewBox="0 0 56 56"><path d="M17 15h22c3 0 4.8 3.2 3.3 5.8L30.4 41.7a2.8 2.8 0 0 1-4.8 0L13.7 20.8C12.2 18.2 14 15 17 15Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M28 15v27" stroke="#fff" stroke-width="4"/></svg></div>

<div class="glass pay"><div class="t muted">Способы пополнения</div>
<div class="m"><i class="g"></i>Crypto Bot <span>USDT · TON</span></div>
<div class="m"><i class="b"></i>xRocket <span>USDT</span></div>
<div class="m"><i class="t2"></i>TON <span>перевод</span></div></div></div><div class="left"><span class="tag">КОШЕЛЁК</span><h1>Пополнение<br>за минуту</h1><p>Баланс в долларах · оплата криптовалютой</p><div class="chips"><span>Crypto Bot</span><span>xRocket</span><span>TON</span></div></div></div></body></html>
