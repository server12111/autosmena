<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased}

.bg{width:1280px;height:720px;background:linear-gradient(150deg,#1A2A5E 0%,#0E1838 100%);position:relative;overflow:hidden;color:#fff}
.flag{position:absolute;right:0;top:0;width:640px;height:720px;
 background:repeating-linear-gradient(180deg,#B22234 0 55.4px,#FFFFFF 55.4px 110.8px);
 -webkit-mask:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.04) 25%,rgba(0,0,0,.22) 50%,rgba(0,0,0,.6) 75%,#000 100%)}
.canton{position:absolute;right:0;top:0;width:380px;height:388px;background:linear-gradient(90deg,rgba(60,59,110,0) 0%,#3C3B6E 35%);display:flex;flex-direction:column;justify-content:space-evenly;padding:10px 0}
.sr{display:flex;justify-content:space-evenly;padding:0 14px 0 90px}
.sr:nth-child(even){padding:0 40px 0 116px}
.sr span{font-size:26px;line-height:1;color:#fff}
.shade-old{position:absolute;right:0;top:0;width:640px;height:720px;background:radial-gradient(48% 42% at 64% 70%,rgba(26,47,107,.78),rgba(26,47,107,.35) 55%,transparent 80%)}
.halo{position:absolute;right:0;top:200px;width:620px;height:480px;background:radial-gradient(42% 46% at 62% 50%,rgba(20,34,80,.8),rgba(20,34,80,.35) 60%,transparent 82%)}
.plus{position:absolute;right:104px;top:322px;font-weight:900;font-size:250px;letter-spacing:-14px;line-height:1;
 background:linear-gradient(170deg,#FFFFFF 30%,#D8E3FF 100%);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 10px 28px rgba(10,20,60,.35));
 }
.left{position:absolute;left:90px;top:50%;transform:translateY(-50%);width:600px}
.tag{display:inline-block;padding:10px 18px;border-radius:10px;background:#E63946;font-weight:800;font-size:22px;letter-spacing:3px}
h1{margin-top:28px;font-weight:900;font-size:76px;line-height:.98;letter-spacing:-3px}
p{margin-top:24px;font-size:28px;opacity:.8;font-weight:500}
.chips{margin-top:38px;display:flex;gap:12px}
.chips span{padding:12px 18px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);font-weight:600;font-size:19px;white-space:nowrap}

.art{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:500px;height:560px}
.glow{position:absolute;right:-80px;top:50%;transform:translateY(-50%);width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,60,.2) 0%,transparent 62%)}
.glass{position:absolute;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 30px 60px rgba(4,10,35,.45);backdrop-filter:blur(16px)}
.muted{color:#93A3C2;font-weight:600}
.mono{font-family:'JetBrains Mono',monospace}

svg.lines{position:absolute;inset:0;width:500px;height:560px}
.node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.me{width:150px;height:150px;left:175px;top:205px;background:linear-gradient(135deg,#FFB547,#FF7A3D);font-size:46px;box-shadow:0 0 0 12px rgba(255,170,70,.15),0 24px 50px rgba(4,10,35,.5)}
.fr{width:92px;height:92px;background:linear-gradient(135deg,#5AC8FA,#1272D6);font-size:32px;box-shadow:0 16px 36px rgba(4,10,35,.45)}
.bonus{position:absolute;padding:9px 14px;border-radius:12px;font-weight:800;font-size:20px;color:#FFD08A;background:rgba(255,170,70,.14);border:1px solid rgba(255,170,70,.45)}
</style></head><body><div class="bg"><div class="glow"></div><div class="art"><svg class="lines" viewBox="0 0 500 560"><g stroke="rgba(255,255,255,.22)" stroke-width="2.5" stroke-dasharray="6 8">
<line x1="250" y1="280" x2="90" y2="96"/><line x1="250" y1="280" x2="410" y2="96"/><line x1="250" y1="280" x2="56" y2="400"/><line x1="250" y1="280" x2="444" y2="400"/><line x1="250" y1="280" x2="250" y2="500"/></g></svg>
<div class="node fr" style="left:44px;top:50px">A</div><div class="node fr" style="left:364px;top:50px">K</div>
<div class="node fr" style="left:10px;top:354px">M</div><div class="node fr" style="left:398px;top:354px">D</div><div class="node fr" style="left:204px;top:454px">R</div>
<div class="node me">5%</div>
<div class="bonus" style="left:120px;top:150px">+$0.50</div><div class="bonus" style="left:300px;top:160px">+$1.25</div><div class="bonus" style="left:330px;top:300px">+$0.25</div></div><div class="left"><span class="tag">РЕФЕРАЛЫ</span><h1>Приглашай<br>и зарабатывай</h1><p>5% с пополнений друзей — сразу на баланс</p><div class="chips"><span>Навсегда</span><span>Без лимитов</span><span>Моментально</span></div></div></div></body></html>
