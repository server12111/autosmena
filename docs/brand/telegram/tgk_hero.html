<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:'Inter Display','Inter',sans-serif;-webkit-font-smoothing:antialiased}
.bg{width:1280px;height:720px;position:relative;overflow:hidden;color:#fff;background:radial-gradient(70% 90% at 50% 45%,#2B4BA0 0%,#1A2A5E 50%,#0B1430 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.halo{position:absolute;width:900px;height:500px;border-radius:50%;background:radial-gradient(closest-side,rgba(90,200,250,.28),transparent)}
.word{position:relative;font-weight:900;font-size:210px;letter-spacing:-6px;line-height:1;text-shadow:0 20px 60px rgba(4,10,35,.6)}
.uline{position:relative;margin-top:28px;width:300px;height:18px;border-radius:9px;background:linear-gradient(90deg,#E63946,#FF7A6B);box-shadow:0 10px 30px rgba(230,57,70,.45)}
.sub{position:relative;margin-top:30px;font-size:32px;font-weight:600;color:#C9D6EE}
.chip{position:absolute;padding:16px 24px;border-radius:20px;font-weight:800;font-size:24px;white-space:nowrap;
 background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 24px 50px rgba(4,10,35,.45);backdrop-filter:blur(14px)}
</style></head><body><div class="bg"><div class="halo"></div>
<div class="chip" style="left:90px;top:90px;transform:rotate(-6deg)">⚡ Наличие номеров</div>
<div class="chip" style="right:110px;top:110px;transform:rotate(5deg)">🇺🇸 Telegram +1</div>
<div class="chip" style="left:130px;bottom:90px;transform:rotate(4deg)">⭐ Рефералы 5%</div>
<div class="chip" style="right:90px;bottom:100px;transform:rotate(-5deg)">💬 Коды прямо в бот</div>
<div class="word">SMENA</div><div class="uline"></div><div class="sub">Официальный канал магазина</div>
</div></body></html>
